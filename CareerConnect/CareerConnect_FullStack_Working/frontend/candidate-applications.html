<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Applications</title><link rel="stylesheet" href="style.css"><style>.candidate-extra{margin-top:10px;padding:12px;border-radius:10px;background:#faf7fb;border:1px solid var(--line);font-size:12px}.offer-actions{display:flex;gap:8px;margin-top:10px}.offer-actions button{padding:8px 12px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.accept-offer{background:#5da978;color:#fff}.decline-offer{background:#d75b63;color:#fff}.job-details{margin-top:10px;padding:14px;border-radius:12px;background:#f8f4fb;border:1px solid var(--line);line-height:1.55}.job-details h4{margin:0 0 8px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.detail-grid b{display:block}.detail-wide{margin-top:10px}.feedback-card{margin-top:10px;background:#f4effb;border:1px solid var(--line)}.feedback-row{display:flex;gap:8px;margin-top:8px;line-height:1.5}.feedback-row strong{min-width:145px}.feedback-wide{display:block}.feedback-wide p{margin:5px 0 0;line-height:1.55}.feedback-result{font-weight:700;color:var(--primary)}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="sidebar"><a class="brand" href="index.html">🎓 CareerConnect</a><a href="candidate-dashboard.html">⌂ Dashboard</a><a href="jobs.html">▣ Browse Jobs</a><a class="active" href="candidate-applications.html">◫ My Applications</a><a href="candidate-profile.html">♙ Profile</a><a onclick="openNotifications()">🔔 Notifications</a><a onclick="logout()">↪ Logout</a></aside><main class="dashboard"><header class="dashbar"><span></span><span id="bell"></span><span>👩🏻</span></header><div class="page-title"><div><h1>My Applications</h1><p>Track applications, job details, interviews, feedback and offers.</p></div></div><div id="table" class="table-card"></div></main></div><script src="app.js"></script><script>requireRole("candidate");document.getElementById("bell").innerHTML=bell();function label(s){return({pending:"Pending",review:"Under Review",shortlisted:"Shortlisted",interview:"Interview",selected:"Selected",accepted:"Selected",rejected:"Rejected"})[s]||s||"-"}function resultLabel(s){return({passed:"Passed",failed:"Failed",next_round:"Next Round"})[s]||s||"-"}function detailsBlock(x){return `<div class="job-details"><h4>📄 Job & Company Details</h4><div class="detail-grid"><div><b>Job Type</b>${esc(x.job_type||"-")}</div><div><b>Work Mode</b>${esc(x.work_mode||"-")}</div><div><b>Location</b>${esc(x.job_location||"Remote")}</div><div><b>Salary / Stipend</b>${esc(x.salary||"Not specified")}</div><div><b>Company</b>${esc(x.company_name||"-")}</div><div><b>Industry</b>${esc(x.company_industry||"-")}</div><div><b>Company Size</b>${esc(x.company_size||"-")}</div><div><b>Headquarters</b>${esc(x.company_headquarters||"-")}</div></div><div class="detail-wide"><b>Job Description</b><p>${esc(x.job_description||"No description provided.").replace(/\n/g,"<br>")}</p></div><div class="detail-wide"><b>About Company</b><p>${esc(x.company_about||"Company information not provided.").replace(/\n/g,"<br>")}</p></div>${x.company_website?`<div class="detail-wide"><b>Website</b> <a href="${esc(x.company_website)}" target="_blank" rel="noopener noreferrer">${esc(x.company_website)}</a></div>`:""}${x.company_hiring_process?`<div class="detail-wide"><b>Hiring Process</b><p>${esc(x.company_hiring_process).replace(/\n/g,"<br>")}</p></div>`:""}</div>`}function feedbackBlock(i){const hasFeedback=i.feedback||i.technical||i.communication||i.problem_solving||i.strengths||i.improvements||i.result;if(!hasFeedback)return "";return `<div class="candidate-extra feedback-card"><b>📝 Interview Feedback</b>${i.result?`<div class="feedback-row"><strong>Interview Result:</strong><span class="feedback-result">${esc(resultLabel(i.result))}</span></div>`:""}${i.technical?`<div class="feedback-row"><strong>Technical:</strong><span>${esc(i.technical)}</span></div>`:""}${i.communication?`<div class="feedback-row"><strong>Communication:</strong><span>${esc(i.communication)}</span></div>`:""}${i.problem_solving?`<div class="feedback-row"><strong>Problem Solving:</strong><span>${esc(i.problem_solving)}</span></div>`:""}${i.feedback?`<div class="feedback-row feedback-wide"><strong>Employer Remarks:</strong><p>${esc(i.feedback)}</p></div>`:""}${i.strengths?`<div class="feedback-row feedback-wide"><strong>Strengths:</strong><p>${esc(i.strengths)}</p></div>`:""}${i.improvements?`<div class="feedback-row feedback-wide"><strong>Areas for Improvement:</strong><p>${esc(i.improvements)}</p></div>`:""}</div>`}async function respond(id,response){if(!confirm(`Are you sure you want to ${response} this offer?`))return;try{await api(`/applications/${id}/offer-response?response=${response}`,{method:"PATCH",headers:authHeaders()});alert(`Offer ${response}.`);load()}catch(e){alert(e.message)}}function toggleDetails(id){const el=document.getElementById(`details-${id}`);if(el)el.classList.toggle("hidden")}async function load(){try{const a=await api("/applications/mine",{headers:authHeaders()});document.getElementById("table").innerHTML=`<table><tr><th>Job</th><th>Company</th><th>Location</th><th>Applied</th><th>Status</th></tr>${a.map(x=>{const i=x.interview||{},o=x.offer||{};return `<tr><td><b>${esc(x.job_title)}</b><br><small>${esc(x.job_type)} · ${esc(x.work_mode)}</small><br><button class="btn outline" style="margin-top:8px" onclick="toggleDetails(${x.application_id})">View Job Description & Company</button><div id="details-${x.application_id}" class="hidden">${detailsBlock(x)}</div>${i.date?`<div class="candidate-extra"><b>🎤 Interview Scheduled</b><br>📅 ${esc(i.date)} · 🕐 ${esc(i.time||"-")} · 💻 ${esc(i.mode||"-")}${i.interviewer?`<br>Interviewer: ${esc(i.interviewer)}`:""}${i.round?`<br>Round: ${esc(i.round)}`:""}${i.instructions?`<br>Instructions: ${esc(i.instructions)}`:""}${i.link?`<br><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">Join Meeting ↗</a>`:""}</div>`:""}${feedbackBlock(i)}${o.status&&o.status!=="not_created"?`<div class="candidate-extra"><b>📨 Offer ${esc(o.status)}</b><br>Position: ${esc(o.position||"-")}<br>Salary/Stipend: ${esc(o.salary||"-")}<br>Joining: ${esc(o.joining_date||"-")}<br>Location: ${esc(o.work_location||"-")}<br>Employment: ${esc(o.employment_type||"-")}<br>Expires: ${esc(o.expiry_date||"-")}${o.status==="sent"?`<div class="offer-actions"><button class="accept-offer" onclick="respond(${x.application_id},'accepted')">Accept Offer</button><button class="decline-offer" onclick="respond(${x.application_id},'declined')">Decline Offer</button></div>`:""}</div>`:""}</td><td>${esc(x.company_name||"-")}</td><td>${esc(x.job_location||"Remote")}</td><td>${fmtDate(x.applied_at)}</td><td><span class="status ${esc(x.status)}">${label(x.status)}</span></td></tr>`}).join("")||"<tr><td colspan='5'>No applications yet.</td></tr>"}</table>`}catch(e){document.getElementById("table").innerHTML=`<p>${esc(e.message)}</p>`}}load();</script></body></html>
