<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Candidate Dashboard</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><a class="brand" href="index.html">🎓 CareerConnect</a><a class="active" href="candidate-dashboard.html">⌂ Dashboard</a><a href="jobs.html">▣ Browse Jobs</a><a href="candidate-applications.html">◫ My Applications</a><a href="candidate-profile.html">♙ Profile</a><a onclick="openNotifications()">🔔 Notifications <i>!</i></a><a onclick="logout()">↪ Logout</a></aside><main class="dashboard"><header class="dashbar"><input class="mini-search" placeholder="Search for jobs, skills, or companies..." onkeydown="if(event.key==='Enter')location.href='jobs.html?q='+encodeURIComponent(this.value)"><span id="bell"></span><span>◐</span><span id="who">Candidate</span></header><section class="welcome"><div><h1>Welcome back, <span id="name">Candidate</span>! 👋</h1><p>Keep applying, keep learning, keep growing.</p></div></section><section class="stats"><div><b id="available">0</b><small>Available Jobs</small></div><div><b id="applied">0</b><small>Applied</small></div><div><b id="review">0</b><small>In Review</small></div><div><b id="accepted">0</b><small>Accepted</small></div></section><h2>Recommended Opportunities</h2><div id="jobs" class="job-list"></div></main></div><script src="app.js"></script><script>if(!requireRole("candidate")){}else{document.getElementById("bell").innerHTML=bell();(async()=>{try{const me=await api("/auth/me",{headers:authHeaders()});document.getElementById("name").textContent=me.name;document.getElementById("who").textContent=me.name;const jobs=await api("/jobs/");const apps=await api("/applications/mine",{headers:authHeaders()});document.getElementById("available").textContent=jobs.length;document.getElementById("applied").textContent=apps.length;document.getElementById("review").textContent=apps.filter(x=>x.status==="pending").length;document.getElementById("accepted").textContent=apps.filter(x=>x.status==="accepted"||x.status==="selected").length;document.getElementById("jobs").innerHTML=jobs.slice(0,6).map(j=>`<article class="job"><div><h3>${esc(j.title)}</h3><p>${esc(j.location||"Remote")} · ${esc(j.job_type)} · ${esc(j.work_mode)}</p><div class="tags">${tags(j.skills)}</div></div><button class="btn primary" onclick="viewJob(${j.id})">View Job & Apply</button></article>`).join("")}catch(e){document.getElementById("jobs").innerHTML="<p>"+esc(e.message)+"</p>"}})()}function viewJob(id){location.href=`jobs.html?job=${encodeURIComponent(id)}`}</script></body></html>
