<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Post Job</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><a class="brand" href="index.html">🎓 CareerConnect</a><a href="company-dashboard.html">⌂ Dashboard</a><a class="active" href="post-job.html">▣ Post Job</a><a href="employer-jobs.html">◫ My Jobs</a><a href="employer-applications.html">♙ Applications</a><a href="company-profile.html">🏢 Company Profile</a><a onclick="logout()">↪ Logout</a></aside><main class="dashboard"><header class="dashbar"><span></span><span id="bell"></span><span>🏢 Company</span></header><div class="profile-card"><h1 id="pageTitle">Post a New Job</h1><p id="pageSub">Add complete job information so candidates can make an informed application.</p><form id="jobForm" class="form-grid"><div class="form-field"><label>Job Title</label><input name="title" required placeholder="Software Development Intern"></div><div class="form-field"><label>Location</label><input name="location" placeholder="Bengaluru"></div><div class="form-field"><label>Job Type</label><select name="job_type"><option>Internship</option><option>Full-time</option><option>Part-time</option></select></div><div class="form-field"><label>Work Mode</label><select name="work_mode"><option>Remote</option><option>Hybrid</option><option>On-site</option></select></div><div class="form-field full-field"><label>Salary / Stipend</label><input name="salary" placeholder="₹15,000/month or ₹6 LPA"></div><div class="form-field full-field"><label>Skills (comma separated)</label><input name="skills" placeholder="Python, FastAPI, SQL"></div><div class="form-field full-field"><label>Description</label><textarea name="description" rows="7" required placeholder="Describe responsibilities, requirements, duration, and other important details..."></textarea></div></form><div class="save-row"><button type="button" class="btn primary" onclick="saveJob()" id="saveBtn">Publish Job</button></div><div id="msg"></div></div></main></div><script src="app.js"></script><script>requireRole("employer");document.getElementById("bell").innerHTML=bell();const id=new URLSearchParams(location.search).get("id");async function load(){if(!id)return;try{const j=await api(`/jobs/${id}`);document.getElementById("pageTitle").textContent="Edit Job";document.getElementById("pageSub").textContent="Update your job posting.";document.getElementById("saveBtn").textContent="Save Changes";const f=document.getElementById("jobForm");for(const k of ["title","location","job_type","work_mode","salary","skills","description"]){if(f.elements[k])f.elements[k].value=j[k]??""}}catch(e){document.getElementById("msg").textContent=e.message}}async function saveJob(){const f=new FormData(document.getElementById("jobForm"));const body=Object.fromEntries(f.entries());try{await api(id?`/jobs/${id}`:"/jobs/",{method:id?"PATCH":"POST",headers:authHeaders(true),body:JSON.stringify(body)});document.getElementById("msg").textContent=id?"Job updated successfully!":"Job published successfully!";document.getElementById("msg").style.color="#43835c";setTimeout(()=>location.href="employer-jobs.html",700)}catch(e){document.getElementById("msg").textContent=e.message;document.getElementById("msg").style.color="#b43e4c"}}load();</script></body></html>
