<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Candidate Profile</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><a class="brand" href="index.html">🎓 CareerConnect</a><a href="candidate-dashboard.html">⌂ Dashboard</a><a href="jobs.html">▣ Browse Jobs</a><a href="candidate-applications.html">◫ My Applications</a><a class="active" href="candidate-profile.html">♙ Profile</a><a onclick="openNotifications()">🔔 Notifications</a><a onclick="logout()">↪ Logout</a></aside><main class="dashboard"><header class="dashbar"><span></span><span id="bell"></span><span>👩🏻</span></header><div class="profile-card"><h1>Candidate Profile</h1><p>Keep your profile updated so companies can understand your background.</p><form id="profileForm" class="form-grid"><div class="form-field"><label>Phone</label><input name="phone"></div><div class="form-field"><label>Location</label><input name="location"></div><div class="form-field"><label>College</label><input name="college"></div><div class="form-field"><label>Degree</label><input name="degree"></div><div class="form-field"><label>Branch</label><input name="branch"></div><div class="form-field"><label>Current Year</label><input name="current_year"></div><div class="form-field"><label>Graduation Year</label><input name="graduation_year"></div><div class="form-field"><label>CGPA</label><input name="cgpa"></div><div class="form-field full-field"><label>About Me</label><textarea name="about" rows="3"></textarea></div><div class="form-field full-field"><label>Qualifications</label><textarea name="qualifications" rows="3"></textarea></div><div class="form-field full-field"><label>Skills (comma separated)</label><textarea name="skills" rows="3"></textarea></div><div class="form-field full-field"><label>Projects</label><textarea name="projects" rows="4"></textarea></div><div class="form-field full-field"><label>Experience</label><textarea name="experience" rows="3"></textarea></div><div class="form-field full-field"><label>Achievements</label><textarea name="achievements" rows="3"></textarea></div><div class="form-field full-field"><label>Certifications</label><textarea name="certifications" rows="3"></textarea></div><div class="form-field"><label>GitHub</label><input name="github"></div><div class="form-field"><label>LinkedIn</label><input name="linkedin"></div><div class="form-field"><label>Portfolio</label><input name="portfolio"></div><div class="form-field"><label>Resume URL</label><input name="resume_url"></div></form><div class="save-row"><button class="btn primary" onclick="saveProfile()">Save Profile</button></div><div id="msg"></div></div></main></div><script src="app.js"></script><script>requireRole("candidate");document.getElementById("bell").innerHTML=bell();async function load(){const p=await api("/candidate-profile/me",{headers:authHeaders()});const f=document.getElementById("profileForm");Object.keys(p).forEach(k=>{if(f.elements[k])f.elements[k].value=p[k]??""})}async function saveProfile(){const f=new FormData(document.getElementById("profileForm"));const body=Object.fromEntries(f.entries());try{await api("/candidate-profile/me",{method:"PUT",headers:authHeaders(true),body:JSON.stringify(body)});document.getElementById("msg").textContent="Profile saved successfully!";document.getElementById("msg").style.color="#43835c"}catch(e){document.getElementById("msg").textContent=e.message;document.getElementById("msg").style.color="#b43e4c"}}load()</script></body></html>
