<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Candidate Registration</title><link rel="stylesheet" href="style.css"></head><body><div class="auth-page"><div class="form-card"><a class="brand" href="index.html">🎓 CareerConnect</a><h1>Candidate Registration</h1><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email address"><input id="password" type="password" placeholder="Password (minimum 6 characters)"><button class="btn primary full" onclick="registerUser()">Create Candidate Account</button><div id="msg" style="margin-top:10px"></div><p>Already registered? <a href="login.html">Login</a></p></div></div><script src="app.js"></script><script>async function registerUser(){const msg=document.getElementById("msg");try{await api("/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("name").value,email:document.getElementById("email").value,password:document.getElementById("password").value,role:"candidate"})});msg.textContent="Registration successful! Redirecting to login…";msg.style.color="#43835c";setTimeout(()=>location.href="login.html",700)}catch(e){msg.textContent=e.message;msg.style.color="#b43e4c"}}</script></body></html>
