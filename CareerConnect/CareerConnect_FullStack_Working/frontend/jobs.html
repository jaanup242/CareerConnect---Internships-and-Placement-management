<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Jobs - CareerConnect</title><link rel="stylesheet" href="style.css"><style>
.job-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn:disabled{opacity:.6;cursor:not-allowed}.job-modal{position:fixed;inset:0;background:rgba(20,15,30,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}.job-modal.hidden{display:none}.job-modal-card{width:min(850px,95vw);max-height:90vh;overflow:auto;background:var(--card,#fff);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.job-modal-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.job-modal-close{border:0;background:transparent;font-size:26px;cursor:pointer}.detail-section{margin-top:18px;padding:15px;border-radius:12px;background:#faf7fb;border:1px solid var(--line)}.detail-section h4{margin:0 0 8px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detail-item b{display:block}.applied-badge{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#e7f5eb;color:#34724a;font-weight:700;font-size:12px}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}}</style></head>
<body><div class="app"><aside class="sidebar"><a class="brand" href="index.html">🎓 CareerConnect</a><a href="candidate-dashboard.html">⌂ Dashboard</a><a class="active" href="jobs.html">▣ Browse Jobs</a><a href="candidate-applications.html">◫ My Applications</a><a href="candidate-profile.html">♙ Profile</a><a onclick="openNotifications()">🔔 Notifications</a><a onclick="logout()">↪ Logout</a></aside><main class="dashboard"><header class="dashbar"><input id="search" class="mini-search" placeholder="Search jobs, skills, or companies..."><span id="bell"></span><span>👩🏻</span></header><div class="page-title"><div><h1>Job Opportunities</h1><p>Find an opportunity that matches your skills.</p></div></div><div class="content-grid"><aside class="filters"><h3>Filters</h3><b>Job Type</b><label><input type="checkbox" value="Internship" class="jt"> Internship</label><label><input type="checkbox" value="Full-time" class="jt"> Full-time</label><label><input type="checkbox" value="Part-time" class="jt"> Part-time</label><b>Work Mode</b><label><input type="checkbox" value="Remote" class="wm"> Remote</label><label><input type="checkbox" value="Hybrid" class="wm"> Hybrid</label><label><input type="checkbox" value="On-site" class="wm"> On-site</label><button class="btn primary" onclick="render()">Apply Filters</button></aside><section id="list" class="job-list"></section></div></main></div>
<div id="jobModal" class="job-modal hidden" onclick="if(event.target===this)closeDetails()"><div class="job-modal-card"><div id="jobDetails"></div></div></div>
<script src="app.js"></script><script>
requireRole("candidate");document.getElementById("bell").innerHTML=bell();let all=[];const params=new URLSearchParams(location.search);document.getElementById("search").value=params.get("q")||"";
async function load(){try{all=await api("/jobs/");render()}catch(e){document.getElementById("list").innerHTML=`<div class="profile-card">${esc(e.message)}</div>`}}
function render(){const q=document.getElementById("search").value.toLowerCase();const jtypes=[...document.querySelectorAll(".jt:checked")].map(x=>x.value);const modes=[...document.querySelectorAll(".wm:checked")].map(x=>x.value);const filtered=all.filter(j=>(!q||`${j.title} ${j.description} ${j.skills||""} ${j.company_name||""}`.toLowerCase().includes(q))&&(!jtypes.length||jtypes.includes(j.job_type))&&(!modes.length||modes.includes(j.work_mode)));document.getElementById("list").innerHTML=filtered.length?filtered.map(j=>`<article class="job"><div><h3>${esc(j.title)}</h3><p><b>🏢 ${esc(j.company_name||"Company")}</b></p><p>${esc(j.location||"Remote")} · ${esc(j.job_type)} · ${esc(j.work_mode)}</p>${j.salary?`<p>💰 <b>${esc(j.salary)}</b></p>`:""}<div class="tags">${tags(j.skills)}</div><p>${esc((j.description||"").slice(0,180))}${(j.description||"").length>180?"…":""}</p><div class="job-actions"><button class="btn outline" onclick="showDetails(${j.id})">View Details</button><button class="btn primary" onclick="showDetails(${j.id},true)">View Description & Apply</button></div></div></article>`).join(""):"<div class='profile-card'>No matching jobs found.</div>"}
function showDetails(id,focusApply=false){const j=all.find(x=>x.id===id);if(!j)return;document.getElementById("jobDetails").innerHTML=`<div class="job-modal-head"><div><h2>${esc(j.title)}</h2><p><b>🏢 ${esc(j.company_name||"Company")}</b></p></div><button class="job-modal-close" onclick="closeDetails()">×</button></div><div class="detail-section"><h4>💼 Job Details</h4><div class="detail-grid"><div class="detail-item"><b>Location</b>${esc(j.location||"Remote")}</div><div class="detail-item"><b>Job Type</b>${esc(j.job_type||"-")}</div><div class="detail-item"><b>Work Mode</b>${esc(j.work_mode||"-")}</div><div class="detail-item"><b>Salary / Stipend</b>${esc(j.salary||"Not specified")}</div></div></div><div class="detail-section"><h4>📄 Job Description</h4><p>${esc(j.description||"No description provided.").replace(/\n/g,"<br>")}</p></div><div class="detail-section"><h4>🛠 Required Skills</h4><div class="tags">${tags(j.skills)||"Not specified"}</div></div><div class="detail-section"><h4>🏢 About Company</h4><p>${esc(j.company_about||"Company information not provided.").replace(/\n/g,"<br>")}</p><div class="detail-grid"><div class="detail-item"><b>Industry</b>${esc(j.company_industry||"-")}</div><div class="detail-item"><b>Company Type</b>${esc(j.company_type||"-")}</div><div class="detail-item"><b>Company Size</b>${esc(j.company_size||"-")}</div><div class="detail-item"><b>Headquarters</b>${esc(j.company_headquarters||"-")}</div><div class="detail-item"><b>Website</b>${j.company_website?`<a href="${esc(j.company_website)}" target="_blank" rel="noopener noreferrer">${esc(j.company_website)}</a>`:"-"}</div><div class="detail-item"><b>Preferred Skills</b>${esc(j.company_preferred_skills||"-")}</div></div></div>${j.company_hiring_process?`<div class="detail-section"><h4>📌 Hiring Process</h4><p>${esc(j.company_hiring_process).replace(/\n/g,"<br>")}</p></div>`:""}<div class="job-actions"><button class="btn primary" id="modalApply" onclick="apply(${j.id})">Apply Now</button><button class="btn outline" onclick="closeDetails()">Close</button></div>`;document.getElementById("jobModal").classList.remove("hidden");if(focusApply)setTimeout(()=>document.getElementById("modalApply")?.focus(),50)}
function closeDetails(){document.getElementById("jobModal").classList.add("hidden")}
async function apply(id){try{await api("/applications/",{method:"POST",headers:authHeaders(true),body:JSON.stringify({job_id:id})});closeDetails();render();}catch(e){alert(e.message)}}
document.getElementById("search").addEventListener("input",render);load().then(()=>{const jobId=Number(params.get("job"));if(jobId)showDetails(jobId,true);});
</script></body></html>
