<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Company Profile</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><a class="brand" href="index.html">🎓 CareerConnect</a><a href="company-dashboard.html">⌂ Dashboard</a><a href="post-job.html">▣ Post Job</a><a href="employer-jobs.html">◫ My Jobs</a><a href="employer-applications.html">♙ Applications</a><a class="active" href="company-profile.html">🏢 Company Profile</a><a onclick="logout()">↪ Logout</a></aside><main class="dashboard"><header class="dashbar"><span></span><span id="bell"></span><span>🏢 Company</span></header><div class="profile-card"><h1>Company Profile</h1><p>Build the company presence candidates will see.</p><form id="companyForm" class="form-grid"><div class="form-field"><label>Company Name</label><input name="company_name"></div><div class="form-field"><label>Industry</label><input name="industry"></div><div class="form-field"><label>Company Type</label><input name="company_type"></div><div class="form-field"><label>Founded Year</label><input name="founded_year"></div><div class="form-field"><label>Company Size</label><input name="company_size"></div><div class="form-field"><label>Headquarters</label><input name="headquarters"></div><div class="form-field full-field"><label>Website</label><input name="website"></div><div class="form-field full-field"><label>About Company</label><textarea name="about" rows="4"></textarea></div><div class="form-field"><label>Hiring Positions</label><textarea name="hiring_positions" rows="3"></textarea></div><div class="form-field"><label>Departments</label><textarea name="departments" rows="3"></textarea></div><div class="form-field"><label>Internships</label><select name="internships"><option>Yes</option><option>No</option></select></div><div class="form-field"><label>Full-time</label><select name="full_time"><option>Yes</option><option>No</option></select></div><div class="form-field"><label>Work Mode</label><input name="work_mode" placeholder="Hybrid"></div><div class="form-field"><label>Minimum Qualification</label><input name="minimum_qualification"></div><div class="form-field full-field"><label>Preferred Skills</label><textarea name="preferred_skills" rows="3"></textarea></div><div class="form-field full-field"><label>Hiring Process</label><textarea name="hiring_process" rows="3"></textarea></div><div class="form-field"><label>LinkedIn</label><input name="linkedin"></div><div class="form-field"><label>GitHub</label><input name="github"></div></form><div class="save-row"><button class="btn primary" onclick="saveCompany()">Save Company Profile</button></div><div id="msg"></div></div></main></div><script src="app.js"></script><script>requireRole("employer");document.getElementById("bell").innerHTML=bell();async function load(){const p=await api("/company-profile/me",{headers:authHeaders()});const f=document.getElementById("companyForm");Object.keys(p).forEach(k=>{if(f.elements[k])f.elements[k].value=p[k]??""})}async function saveCompany(){const f=new FormData(document.getElementById("companyForm"));const body=Object.fromEntries(f.entries());try{await api("/company-profile/me",{method:"PUT",headers:authHeaders(true),body:JSON.stringify(body)});document.getElementById("msg").textContent="Company profile saved successfully!";document.getElementById("msg").style.color="#43835c"}catch(e){document.getElementById("msg").textContent=e.message;document.getElementById("msg").style.color="#b43e4c"}}load()</script></body></html>
