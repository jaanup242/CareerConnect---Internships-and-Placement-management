<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Applications | CareerConnect</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><a class="brand" href="index.html">🎓 CareerConnect</a><a href="company-dashboard.html">⌂ Dashboard</a><a href="post-job.html">▣ Post Job</a><a href="employer-jobs.html">◫ My Jobs</a><a class="active" href="employer-applications.html">♙ Applications</a><a href="company-profile.html">🏢 Company Profile</a><a onclick="logout()">↪ Logout</a></aside><main class="dashboard"><header class="dashbar"><span></span><span id="bell"></span><span>🏢 Company</span></header><div class="page-title"><div><h1>Applications</h1><p>Review candidates and manage the hiring process.</p></div></div>
<section class="stats"><div><b id="total">0</b><small>Total Applications</small></div><div><b id="review">0</b><small>Under Review</small></div><div><b id="shortlisted">0</b><small>Shortlisted</small></div><div><b id="selected">0</b><small>Selected</small></div></section>
<div class="table-card" style="margin-bottom:16px"><div class="filters-inline"><input id="search" placeholder="Search candidate or job..."><select id="statusFilter"><option value="">All Statuses</option><option value="pending">Pending</option><option value="review">Under Review</option><option value="shortlisted">Shortlisted</option><option value="interview">Interview</option><option value="selected">Selected</option><option value="rejected">Rejected</option></select><select id="sort"><option value="newest">Newest First</option><option value="oldest">Oldest First</option><option value="name">Candidate Name</option></select></div></div>
<div class="table-card"><table><thead><tr><th>Candidate</th><th>Job</th><th>Location</th><th>Applied</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="app.js"></script><script>
requireRole("employer");document.getElementById("bell").innerHTML=bell();let applications=[];
function label(s){return ({pending:"Pending",review:"Under Review",shortlisted:"Shortlisted",interview:"Interview",selected:"Selected",accepted:"Selected",rejected:"Rejected"})[s]||s}
function render(){
 let a=[...applications];const q=document.getElementById("search").value.trim().toLowerCase(),f=document.getElementById("statusFilter").value,s=document.getElementById("sort").value;
 if(q)a=a.filter(x=>(x.candidate_name+" "+x.candidate_email+" "+x.job_title).toLowerCase().includes(q));
 if(f)a=a.filter(x=>x.status===f);
 if(s==="oldest")a.sort((x,y)=>new Date(x.applied_at)-new Date(y.applied_at));
 if(s==="name")a.sort((x,y)=>x.candidate_name.localeCompare(y.candidate_name));
 document.getElementById("rows").innerHTML=a.map(x=>`<tr><td><b>${esc(x.candidate_name)}</b><br><small>${esc(x.candidate_email)}<br>${esc(x.candidate_phone||"")}</small></td><td>${esc(x.job_title)}</td><td>${esc(x.job_location||"Remote")}</td><td>${fmtDate(x.applied_at)}</td><td><span class="status ${esc(x.status)}">${label(x.status)}</span>${x.shortlisted?'<br><small>★ Shortlisted</small>':""}</td><td><a href="application-details.html?id=${x.application_id}">View details</a></td></tr>`).join("")||"<tr><td colspan='6'>No applications match your filters.</td></tr>";
}
async function load(){try{applications=await api("/applications/employer",{headers:authHeaders()});document.getElementById("total").textContent=applications.length;document.getElementById("review").textContent=applications.filter(x=>x.status==="pending"||x.status==="review").length;document.getElementById("shortlisted").textContent=applications.filter(x=>x.shortlisted||x.status==="shortlisted").length;document.getElementById("selected").textContent=applications.filter(x=>x.status==="selected"||x.status==="accepted").length;render()}catch(e){document.getElementById("rows").innerHTML=`<tr><td colspan="6">${esc(e.message)}</td></tr>`}}
["search","statusFilter","sort"].forEach(id=>document.getElementById(id).addEventListener(id==="search"?"input":"change",render));load();
</script></body></html>
